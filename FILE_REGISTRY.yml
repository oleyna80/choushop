# Machine-readable navigation registry for important files and path patterns.
# It is intentionally selective: register authority-bearing files and major
# project zones, not every file.

version: 1
scope: choushop
project:
  name: "ChouShop"
  slug: "choushop"
  root: "/home/azur/Projects/WSL/projects/choushop"

statuses:
  normative: "source of truth or policy-bearing file"
  runtime: "runtime-specific agent configuration"
  reference: "background knowledge; does not override policy"
  example: "illustrative scenario; not mandatory policy"
  log: "evidence/history; not current authority"
  derived: "generated or discovered from other sources"
  local_state: "machine-local or runtime state; do not publish by default"
  source: "project source code or tests"

authority_order:
  - explicit_owner_instruction
  - AGENTS.md
  - approved_work_block_plan
  - PROJECT_MAP.md
  - FILE_REGISTRY.yml
  - runtime_policy_files
  - reference_docs_examples_logs_generated_artifacts

entries:
  AGENTS.md:
    role: root_agent_policy_and_project_constraints
    status: normative
    owner: owner
    update_when:
      - role permissions change
      - approval gates change
      - commerce safety constraints change
      - project source boundaries change
    related:
      - PROJECT_MAP.md
      - FILE_REGISTRY.yml
      - docs/session-bootstrap.md

  PROJECT_MAP.md:
    role: human_readable_project_map
    status: normative
    owner: architect
    update_when:
      - major directories change
      - authority model changes
      - runtime layers change
      - generated or local-only boundaries change
    related:
      - AGENTS.md
      - FILE_REGISTRY.yml
      - docs/session-bootstrap.md

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect
    update_when:
      - key files or path patterns are added moved or removed
      - file authority status changes
      - update triggers change
    related:
      - AGENTS.md
      - PROJECT_MAP.md
      - docs/session-bootstrap.md

  docs/session-bootstrap.md:
    role: new_session_intake_flow
    status: normative
    owner: architect
    update_when:
      - new-session read order changes
      - git or diff preflight changes
      - memory usage policy changes
    related:
      - PROJECT_MAP.md
      - FILE_REGISTRY.yml

  docs/templates/work-block-template.md:
    role: work_block_template
    status: normative
    owner: orchestrator
    update_when:
      - Work Block planning requirements change
      - closeout requirements change
      - verification evidence requirements change
    related:
      - docs/session-bootstrap.md
      - memory-bank/orchestrator-log.md

  docs/templates/project-agent-update-template.md:
    role: project_agent_framework_update_template
    status: normative
    owner: orchestrator
    update_when:
      - framework update handoff requirements change
      - project agent response contract changes
      - manual SDLC update coordination changes
    related:
      - AGENTS.md
      - PROJECT_MAP.md
      - FILE_REGISTRY.yml
      - docs/templates/work-block-template.md

  framework/workflow/codex-model-routing.md:
    role: codex_model_routing_policy
    status: reference
    owner: architect
    update_when:
      - Codex provider or profile guidance changes
      - Codex critic or worker model-routing rules change
      - optional local or cheaper model usage policy changes
    related:
      - PROJECT_MAP.md
      - .codex/config.toml
      - .codex/critic.md

  scripts/bootstrap.sh:
    role: workflow_layer_health_check
    status: normative
    owner: verifier
    update_when:
      - required workflow files change
      - project navigation files change
      - bootstrap health check behavior changes
    related:
      - PROJECT_MAP.md
      - FILE_REGISTRY.yml
      - docs/session-bootstrap.md
      - .agent/project-config.md

  .codex/**:
    role: codex_runtime_policy
    status: runtime
    owner: orchestrator
    update_when:
      - Codex write gate changes
      - Codex critic contract changes
      - local hook policy changes
    related:
      - AGENTS.md
      - memory-bank/orchestrator-log.md
      - memory-bank/review-log.md

  .agent/**:
    role: runtime_neutral_agent_routing
    status: normative
    owner: architect
    update_when:
      - roster changes
      - workflow routing changes
      - skill list changes
      - gate policy changes
    related:
      - AGENTS.md
      - .agent/workflows/sdd-protocol.md

  .agent/project-config.md:
    role: generated_project_runtime_config
    status: derived
    owner: tooling
    update_when:
      - generated by scripts/bootstrap.sh
      - memory directory convention changes
    related:
      - scripts/bootstrap.sh

  .claude/**:
    role: claude_code_team_runtime
    status: runtime
    owner: architect
    update_when:
      - Claude Code agents change
      - hooks change
      - settings or MCP boundaries change
      - per-agent memory policy changes
    related:
      - CLAUDE.md
      - .mcp.json
      - memory-bank/external-team-log.md

  memory-bank/context.md:
    role: durable_project_context
    status: normative
    owner: orchestrator
    update_when:
      - project focus changes
      - durable context is learned and verified
    related:
      - memory-bank/progress.md
      - memory-bank/decisions.md

  memory-bank/projectBrief.md:
    role: product_project_brief
    status: normative
    owner: product
    update_when:
      - project brief changes
      - MVP scope changes
    related:
      - AGENTS.md
      - memory-bank/productContext.md

  memory-bank/orchestrator-log.md:
    role: orchestrator_decision_log
    status: log
    owner: orchestrator
    update_when:
      - significant orchestration decision is made
      - Work Block needs audit trail
    related:
      - .codex/critic.md
      - docs/plans/**

  memory-bank/review-log.md:
    role: critic_reviewer_verifier_log
    status: log
    owner: reviewer
    update_when:
      - critic review runs
      - verifier review runs
      - review findings are resolved
    related:
      - .codex/critic.md
      - .agent/critic-gate.md
      - .agent/verification-gate.md

  memory-bank/external-team-log.md:
    role: external_team_delivery_log
    status: log
    owner: orchestrator
    update_when:
      - Claude Code or another external team is delegated work
      - handoff result is reviewed
    related:
      - .claude/**
      - handoff task files if installed

  docs/plans/**:
    role: work_block_plans
    status: log
    owner: orchestrator
    update_when:
      - Work Block is planned or closed
    related:
      - docs/templates/work-block-template.md

  docs/specs/**:
    role: specifications
    status: normative
    owner: architect
    update_when:
      - product or technical contract changes
    related:
      - docs/tasklist/**
      - docs/plans/**

  docs/design/**:
    role: design_workflow_and_references
    status: reference
    owner: design
    update_when:
      - design workflow changes
      - approved design references change
    related:
      - AGENTS.md
      - docs/plans/**

  docs/reports/**:
    role: reports_and_verification_evidence
    status: log
    owner: verifier
    update_when:
      - verification or review report is created
    related:
      - docs/plans/**
      - memory-bank/review-log.md

  handoff/**:
    role: codex_claude_handoff_runtime
    status: runtime
    owner: orchestrator
    update_when:
      - handoff runner behavior changes
      - external team process changes
    related:
      - memory-bank/external-team-log.md
      - .claude/**

  src/**:
    role: nextjs_application_source
    status: source
    owner: coder
    update_when:
      - approved Work Block includes source changes
    related:
      - AGENTS.md
      - docs/specs/**
      - docs/tasklist/**

  prisma/**:
    role: database_schema_and_migrations
    status: source
    owner: backend
    update_when:
      - approved DB/schema Work Block changes data model
      - migration is reviewed and approved
    related:
      - AGENTS.md
      - memory-bank/decisionLog.md

  package.json:
    role: dependency_and_script_manifest
    status: source
    owner: coder
    update_when:
      - dependency or script changes are approved
    related:
      - package-lock.json

  generated_outputs:
    role: build_cache_generated_artifacts
    status: derived
    owner: tooling
    patterns:
      - node_modules/**
      - .next/**
      - dist/**
      - build/**
      - coverage/**
      - graphify-out/**
      - .playwright-mcp/**
    update_when:
      - generated by tools only
    related:
      - .gitignore

  local_secrets:
    role: local_credentials_and_environment
    status: local_state
    owner: owner
    patterns:
      - .env
      - .env.*
      - "*.pem"
      - "*.key"
      - secrets/**
      - credentials/**
    update_when:
      - never commit; rotate through approved secret process
    related:
      - .gitignore
